<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hirevia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#ededed;--muted:#a4a4a4;--line:#303030;--paper:#080808;--panel:#151515;--mint:#263329;--green:#7ee787;--orange:#ff9f43;--blue:#9cc2ff}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#080808;font-family:'DM Sans',sans-serif}main{max-width:1080px;margin:auto;padding:48px 24px 72px}h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:0;margin:0}h1{font-size:clamp(2.4rem,7vw,5.5rem);line-height:.9}h2{font-size:1.05rem}button,label{font:inherit}button{border:0;cursor:pointer}.mast{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:36px}.mast p{max-width:330px;color:var(--muted);line-height:1.5;margin:0}.panel{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:8px;padding:22px;box-shadow:0 12px 35px rgba(31,65,47,.06)}.status{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.primary,.secondary{padding:11px 17px;border-radius:5px;font-weight:700}.primary{background:var(--green);color:white}.secondary{background:#eef3ee;color:var(--ink);border:1px solid var(--line)}input[type=file]{display:none}.status{margin-top:20px}.status strong{display:block;font-size:1.1rem}.status small{color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9aa79e;margin-right:7px}.dot.active{background:#2ea765;box-shadow:0 0 0 5px #d9f4e4}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0 34px}.stat{border-top:2px solid var(--line);padding-top:10px}.stat b{display:block;font:700 1.6rem 'Space Grotesk'}.stat span{color:var(--muted);font-size:.75rem}.section{margin-top:30px}.section-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}.section-head span{color:var(--muted);font-size:.8rem}.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:12px}.job{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--blue);padding:16px;border-radius:5px}.job h3{font-size:1rem;margin-bottom:3px}.company{color:var(--muted);font-size:.88rem}.details{color:var(--muted);font-size:.78rem;line-height:1.7;margin:12px 0}.match{color:var(--green);font-weight:700}.job a{color:var(--blue);font-weight:700;text-decoration:none;font-size:.85rem}.empty{color:var(--muted);font-size:.85rem;padding:16px 0}@media(max-width:700px){main{padding:30px 16px 52px}.mast{display:block}.mast p{margin-top:16px}.status,.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main>
<header class="mast"><h1>HIREVIA</h1><p>Personal fresher-job monitor driven by profile.yaml.</p></header>
<section class="panel"><div class="actions"><button id="start" class="primary" onclick="startMonitoring()">Start Monitoring</button><button class="secondary" onclick="stopMonitoring()">Stop Monitoring</button><button class="secondary" onclick="resetAllData()">Reset All Data</button></div><div class="status"><div><strong><i id="status-dot" class="dot"></i><span id="status-label">Monitoring Stopped</span></strong><small id="status-error"></small><br><small>Telegram: <b id="telegram-status">Checking...</b></small></div><div><small>Last scan: <b id="last-scan">Never</b></small><br><small>Next scan: <b id="next-scan">When started</b></small><br><small>Interval: <b id="interval">15 seconds</b></small></div></div><div id="source-status" class="details"></div></section>
<section class="stats"><div class="stat"><b id="scanned">0</b><span>Jobs scanned</span></div><div class="stat"><b id="matched">0</b><span>Jobs matched</span></div></section>
<section class="section"><div class="section-head"><h2>MATCHED JOBS</h2><span id="source-count">Sources</span></div><div id="jobs" class="jobs"></div></section>
<section class="section panel"><div class="section-head"><h2>PROFILE.YAML</h2><button class="primary" onclick="saveProfile()">Save Configuration</button></div><textarea id="profile-editor" spellcheck="false"></textarea><small id="profile-message"></small></section>
</main>
<script>
const api=async(url,options={})=>{const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw Error(data.detail||'Request failed');return data};const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));const ago=ts=>{if(!ts)return'Never';const minutes=Math.max(0,Math.floor((Date.now()/1000-ts)/60));return minutes?`${minutes} min ago`:'Just now'};
async function startMonitoring(){try{await api('/api/monitoring/start',{method:'POST'});await refresh()}catch(error){alert(error.message)}}async function stopMonitoring(){await api('/api/monitoring/stop',{method:'POST'});await refresh()}async function resetAllData(){if(!confirm('Delete all collected jobs, cache, scan history, and dashboard runtime data? Your profile, configuration, and Telegram session will be kept.'))return;try{await api('/api/reset',{method:'POST'});await refresh()}catch(error){alert(error.message)}}
function jobCard(job) {
	const score = Number(job.score || 0);
	const applyLink = job.url ? `<a href="${esc(job.url)}" target="_blank" rel="noopener">Apply â†—</a>` : '';
	return `<article class="job"><h3>${esc(job.title)}</h3><div class="company">${esc(job.company)}</div><div class="details">ðŸ“ ${esc(job.location || 'India')}<br>ðŸ¢ ${job.remote ? 'Remote / Hybrid' : 'Work mode from listing'}<br>ðŸŽ“ ${score >= 65 ? 'Entry level eligible' : 'Review experience'}<br><span class="match">Match: ${score}%</span><br>Source: ${esc(job.source)} Â· Detected: ${ago(job.created_at)}</div>${applyLink}</article>`;
}
async function loadJobs() {
	const data = await api('/api/jobs?limit=200&sort_by=score');
	document.querySelector('#jobs').innerHTML = data.jobs.length ? data.jobs.map(jobCard).join('') : '<div class="empty">No matched jobs yet.</div>';
	document.querySelector('#matched').textContent = data.count;
}
async function loadProfile(){const data=await api('/api/config?key=profile_yaml');document.querySelector('#profile-editor').value=data.value||''}
async function saveProfile(){const message=document.querySelector('#profile-message');try{await api('/api/config/one',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'profile_yaml',value:document.querySelector('#profile-editor').value})});message.textContent='Saved. The next scan will use this configuration.'}catch(error){message.textContent=error.message}}
async function refresh() {
	const [monitor, stats, telegram, sources] = await Promise.all([api('/api/monitoring'), api('/api/stats'), api('/api/telegram/status'), api('/api/sources')]);
	document.querySelector('#status-label').textContent = monitor.active ? 'Monitoring Active' : 'Monitoring Stopped';
	document.querySelector('#status-dot').classList.toggle('active', monitor.active);
	document.querySelector('#last-scan').textContent = ago(monitor.last_scan);
	document.querySelector('#next-scan').textContent = monitor.next_scan ? `~${monitor.interval_seconds} seconds` : 'When started';
	document.querySelector('#interval').textContent = `${monitor.interval_seconds} seconds`;
	document.querySelector('#telegram-status').textContent = telegram.status;
	document.querySelector('#source-count').textContent = `${sources.sources.length} sources configured`;
	document.querySelector('#source-status').innerHTML = sources.sources.map(source => `<div>${source.last_error ? '🔴' : source.last_success ? '🟢' : source.enabled ? '🟡' : '⚪'} ${esc(source.name)}: ${source.last_error || (source.last_success ? 'Working' : source.enabled ? 'Not scanned' : 'Disabled')}</div>`).join('');
	document.querySelector('#status-error').textContent = monitor.error ? `Error: ${monitor.error}` : '';
	document.querySelector('#scanned').textContent = monitor.jobs_scanned;
	document.querySelector('#matched').textContent = stats.total;
	await loadJobs();
}
loadProfile(); refresh();
setInterval(refresh, 15000);
</script></body></html>
